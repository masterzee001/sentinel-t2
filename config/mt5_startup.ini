; MT5 startup configuration used by the supervisor when it launches the
; terminal. Exists for ONE reason: the AutoTrading toggle is a GUI switch
; that defaults OFF on a fresh terminal, and while it is off the broker
; refuses every programmatic order with retcode 10027 ("AutoTrading disabled
; by client"). That silently blocked the first real mean-reversion signal on
; Pepperstone (2026-08-12), so it must be forced on at launch rather than
; left to a human remembering to click a button — especially on the VPS,
; where nobody is there to click it.
;
; Passed as: terminal64.exe /config:<this file>

[Experts]
AllowLiveTrading=1
Enabled=1
Account=0
Profile=0
