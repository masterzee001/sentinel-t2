# Project Sentinel Telegram command bot settings.
# Advisor Mode only. Assisted demo approval is gated; no autonomous or live-funded execution.

enabled: true
polling_interval_seconds: 5
allowed_commands:
  - /start
  - /help
  - /status
  - /summary
  - /xauusd
  - /us30
  - /eurusd
  - /gbpusd
  - /btcusd
  - /nas100
  - /symbols
  - /risk
  - /news
  - /coach
  - /ping
  - /positions
  - /plans
  - /journal
  - /backtest
  - /live_stats
  - /stress
  - /readiness
  - /settings
  - /validation
  - /market_watch
  - /paper_status
  - /paper_trades
  - /paper_stats
  - /live_health
  - /live_signals
  - /live_mode
  - /live_limits
  - /live_killswitch
  - /approve_trade
  - /reject_trade
  - /halt_live
  - /resume_live
  - /challenge_status
  - /challenge_progress
  - /challenge_risk
  - /challenge_phase
  - /challenge_governor
  - /challenge_recommendation
  - /activate_challenge_mode
  - /deactivate_challenge_mode
  - /assisted_status
  - /assisted_ticket
  - /assisted_approve
  - /assisted_reject
  - /assisted_dry_run
  - /exec_approve
  - /execute_approve
  - /sandbox_status
  - /sandbox_symbols
  - /sandbox_ticket
  - /sandbox_dry_run
  - /sandbox_approve
  - /sandbox_disable

symbols:
  XAUUSD: XAUUSD
  US30: US30
  EURUSD: EURUSD
  GBPUSD: GBPUSD
  BTCUSD: BTCUSD
  NAS100: NAS100

advisor_mode_only: true

telegram_settings:
  parse_mode: HTML
  disable_web_page_preview: true

max_message_chars: 3800

backtest_summary_paths:
  - data/reports/backtest_365d_summary.json
  - data/reports/latest_backtest_summary.json
  - data/backtest_summary.json
  - data/backtesting/latest_summary.json
  - data/reports/backtest_summary.json

validation_report_path: data/reports/backtest_365d_v2_summary.json
market_watch_report_path: data/reports/market_watch_365d_summary.json
live_paper_report_path: data/reports/live_paper_session.json
emergency_live_report_path: data/reports/emergency_live_status.json
challenge_command_center_report_path: data/reports/challenge_command_center.json
assisted_execution_report_path: data/reports/assisted_execution_status.json
demo_sandbox_report_path: data/reports/demo_sandbox_status.json
