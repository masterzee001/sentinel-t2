version: "1.0"

# NAS100 promoted 2026-08-10 (user-directed) after clearing the production
# promotion rule on the first honest 365D backtest: PF 1.60, WR 60.0%,
# 39 trades, DD within limit (rule: min_pf 1.5, min_wr 55, min_trades 30).
tier_1_production:
  - US30
  - NAS100

# XAUUSD demoted 2026-08-10: 3-year honest PF 0.89 under index logic; full
# exclusion beat per-cell starving out-of-sample (+21.5R vs +14.5R book).
# Re-promotion requires the Macro Pressure Vector redesign to pass the
# walk-forward gate.
tier_2_filtered_production: []

tier_3_demo_sandbox:
  - BTCUSD

tier_4_observer_only:
  - XAUUSD
  - EURUSD
  - GBPUSD

aliases:
  BTCUSD:
    - BTC
    - BTCUSD
    - BTCUSDm
    - BTCUSD.cash
    - BTCUSD.pro
    - XBTUSD
  DE40:
    - DE40
    - GER40      # Pepperstone's DAX symbol (DE40 does not exist there)
    - GER30
    - DAX40
  NAS100:
    - NAS100
    - USTEC
    - USTECH100M
    - NAS100.cash
    - NASUSD

promotion_rules:
  production:
    min_pf: 1.5
    min_wr: 55
    min_trades: 30
    max_dd: 4
  observer:
    min_pf: 1.0
    max_pf: 1.5
  disabled:
    max_pf: 1.0

execution:
  observer_execution_allowed: false
  demo_sandbox_execution_allowed: false
  autonomous_execution_allowed: false

observer_reasons:
  XAUUSD: "XAUUSD observer mode: 3y PF 0.89 under index logic; pending MPV redesign"
  BTCUSD: "BTCUSD demo sandbox: production execution disabled"
  EURUSD: "EURUSD observer-only mode: production execution disabled"
  GBPUSD: "GBPUSD observer-only mode: production execution disabled"
